<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cateye Nails - Nail it by K</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pridi:wght@300;400;600&family=Mulish:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles-category.css" />
</head>
<body data-category="Cateye">
  <header class="page-header">
    <div class="container">
      <div class="topbar">
        <a href="index.html" class="back-link">← Back to home</a>
        <button class="basket-pill" type="button">Basket <span id="basketCount">0</span></button>
      </div>
      <div class="page-heading">
        <div class="s-tag" style="justify-content:center; margin-bottom:12px;">Cateye Collection</div>
        <h1>Cateye Nails</h1>
        <p>Elegant almond-shaped curves with a sculpted, reflective effect that gives a bold and polished finish.</p>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <div class="modal" id="productModal" aria-hidden="true">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <div class="modal-card">
      <div class="modal-carousel">
        <img class="modal-image" id="modalImage" src="" alt="Nail design preview">
        <button class="modal-nav modal-prev" type="button" aria-label="Previous image" onclick="prevGalleryImage()">‹</button>
        <button class="modal-nav modal-next" type="button" aria-label="Next image" onclick="nextGalleryImage()">›</button>
      </div>
      <div class="modal-body">
        <h3 id="modalTitle"></h3>
        <p id="modalDescription"></p>
        <div class="modal-price">Price: <span id="modalPriceValue"></span></div>
        <div class="modal-counter" id="modalImageCount"></div>
        <div class="modal-actions">
          <button class="btn-primary" onclick="addToBasket()">Add to basket</button>
          <button class="btn-secondary" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div class="basket-modal" id="basketModal" aria-hidden="true">
    <div class="basket-backdrop" onclick="closeBasketModal()"></div>
    <div class="basket-panel">
      <div class="basket-header">
        <h2>Your Basket</h2>
        <button class="basket-close" type="button" aria-label="Close basket" onclick="closeBasketModal()">×</button>
      </div>
      <div class="basket-content">
        <div class="basket-empty" id="basketEmpty">Your basket is empty.</div>
        <ul class="basket-list" id="basketList"></ul>
      </div>
      <div class="basket-footer">
        <div class="basket-total">Items: <span id="basketTotal">0</span></div>
        <div class="basket-actions">
          <a href="order.html" class="btn-primary">Checkout</a>
          <button type="button" class="btn-secondary" onclick="clearBasket()">Clear</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="styles-category.js"></script>
</body>
</html>
