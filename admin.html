<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin CMS - Nail it by K</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pridi:wght@300;400;600&family=Mulish:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
  <div class="card login-page" id="loginCard">
    <h1 style="margin-bottom:6px;">Nail It By K — Admin</h1>
    <p class="muted" style="margin-bottom:16px;">Private control panel. Not visible to site visitors.</p>
    <div class="field">
      <label for="adminPassword">Password</label>
      <input id="adminPassword" type="password" placeholder="Enter admin password">
    </div>
    <button id="loginBtn" class="btn">Login</button>
    <div id="loginStatusMessage" class="status info" role="status" aria-live="polite"></div>
  </div>

  <div class="app-shell" id="adminShell" style="display:none;">
    <nav class="sidebar" id="sidebar" aria-label="Admin sections"></nav>
    <div class="main-column">
      <div class="topbar">
        <div class="topbar-brand">Nail It By K — Admin</div>
        <div class="topbar-actions" id="topbarActions"></div>
        <button class="btn btn-secondary" id="logoutBtn" type="button">Logout</button>
      </div>
      <div class="content-area" id="contentArea"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="/admin/app.js"></script>
</body>
</html>
